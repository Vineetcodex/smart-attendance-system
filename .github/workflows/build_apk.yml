name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Android Platform Files
        working-directory: mobile_app
        run: |
          flutter create --platforms=android --org=com.aeroverify.attendance .
          flutter pub get

      - name: 🔨 Build Android Release APK
        working-directory: mobile_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRP-Technology-Attendance-App
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
