name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Lightweight Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK Tools & Licenses
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Build Web App & Sync Android Platform
        working-directory: web_admin
        run: |
          npm install
          npm run build
          npx cap sync android
          # Ensure SDK 34 is pinned
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle || true
          sed -i 's/minSdkVersion = .*/minSdkVersion = 22/' android/variables.gradle || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: 🔨 Compile Android APK
        working-directory: web_admin/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRP-Technology-Attendance-App
          path: web_admin/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
