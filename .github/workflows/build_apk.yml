name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Lightweight Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web_admin/package-lock.json

      - name: 📦 Install Dependencies & Build Web App
        working-directory: web_admin
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: 🔨 Compile Android APK
        working-directory: web_admin/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRP-Technology-Attendance-App
          path: web_admin/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
